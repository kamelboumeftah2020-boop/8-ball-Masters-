<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>نور</title>
  <meta name="description" content="مواعظ، قرآن مسموع، مصحف، ومواقيت الأذان في تطبيق واحد بسيط.">
  <meta name="theme-color" content="#0f6b5c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="icon-btn back" id="backBtn" aria-label="رجوع" hidden>
        <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <h1 class="topbar-title" id="pageTitle">نور</h1>
      <button class="icon-btn" id="themeBtn" aria-label="تبديل المظهر">
        <svg viewBox="0 0 24 24" class="i-moon"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg viewBox="0 0 24 24" class="i-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <!-- المشغل المصغّر -->
    <section class="player" id="player" hidden aria-label="مشغل الصوت">
      <div class="player-progress"><div id="pBar"></div></div>
      <div class="player-row">
        <button class="player-info" id="pInfo">
          <span class="player-art" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 19V6a2 2 0 0 1 2-2h13v13H6a2 2 0 0 0-2 2zm0 0a2 2 0 0 0 2 2h13"/></svg>
          </span>
          <span class="player-text">
            <strong id="pTitle">—</strong>
            <small id="pSub">—</small>
          </span>
        </button>
        <div class="player-ctrls">
          <button class="icon-btn" id="pPrev" aria-label="السابق"><svg viewBox="0 0 24 24"><path d="M6 6v12M20 6l-10 6 10 6z"/></svg></button>
          <button class="play-btn" id="pPlay" aria-label="تشغيل/إيقاف">
            <svg viewBox="0 0 24 24" class="i-play"><path d="M8 5v14l11-7z"/></svg>
            <svg viewBox="0 0 24 24" class="i-pause"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
          </button>
          <button class="icon-btn" id="pNext" aria-label="التالي"><svg viewBox="0 0 24 24"><path d="M18 6v12M4 6l10 6-10 6z"/></svg></button>
        </div>
      </div>
    </section>

    <nav class="tabbar" aria-label="التنقل">
      <a href="#/" data-tab="home">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>الرئيسية</span>
      </a>
      <a href="#/listen" data-tab="listen">
        <svg viewBox="0 0 24 24"><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><rect x="2.5" y="14" width="5" height="7" rx="2"/><rect x="16.5" y="14" width="5" height="7" rx="2"/></svg>
        <span>استماع</span>
      </a>
      <a href="#/mushaf" data-tab="mushaf">
        <svg viewBox="0 0 24 24"><path d="M12 6c-2-1.5-5-2-8-2v14c3 0 6 .5 8 2 2-1.5 5-2 8-2V4c-3 0-6 .5-8 2zM12 6v14"/></svg>
        <span>المصحف</span>
      </a>
      <a href="#/adhan" data-tab="adhan">
        <svg viewBox="0 0 24 24"><path d="M12 2c0 3-4 4-4 8v1h8v-1c0-4-4-5-4-8zM5 11h14M6 11v10h12V11M10 21v-4a2 2 0 0 1 4 0v4"/></svg>
        <span>الأذان</span>
      </a>
      <a href="#/mawaiz" data-tab="mawaiz">
        <svg viewBox="0 0 24 24"><path d="M12 3l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 15.4 7.2 17.9l.9-5.4L4.2 8.7l5.4-.8z"/></svg>
        <span>مواعظ</span>
      </a>
    </nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <audio id="audio" preload="none"></audio>
  <audio id="adhanAudio" preload="none"></audio>

  <script type="module" src="js/app.js"></script>
</body>
</html>
