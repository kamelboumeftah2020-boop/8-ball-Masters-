<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>نور</title>
  <meta name="description" content="القرآن الكريم مقروءًا ومسموعًا، ومواعظ العلماء، والأذكار الصحيحة، ومواقيت الأذان والقبلة — على منهج أهل السنة.">
  <meta name="theme-color" content="#f5f3ec">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="نور">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="icon-btn back" id="backBtn" aria-label="رجوع" hidden>
        <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <h1 class="topbar-title" id="pageTitle">نور</h1>
      <button class="icon-btn" id="themeBtn" aria-label="تبديل المظهر">
        <svg viewBox="0 0 24 24" class="i-moon"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg viewBox="0 0 24 24" class="i-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <!-- المشغّل المصغّر -->
    <section class="player" id="player" hidden aria-label="مشغّل الصوت">
      <div class="player-progress"><div id="pBar"></div></div>
      <div class="player-row">
        <button class="player-info" id="pInfo" aria-label="فتح المشغّل">
          <span class="player-art" id="pArt" aria-hidden="true"></span>
          <span class="player-text">
            <strong id="pTitle">—</strong>
            <small id="pSub">—</small>
          </span>
        </button>
        <div class="player-ctrls">
          <button class="icon-btn" id="pPrev" aria-label="السابق"><svg viewBox="0 0 24 24"><path class="fill" d="M18 6.5v11a1 1 0 0 1-1.6.8L9 12.8a1 1 0 0 1 0-1.6l7.4-5.5a1 1 0 0 1 1.6.8z"/><path d="M6 6v12"/></svg></button>
          <button class="play-btn" id="pPlay" aria-label="تشغيل/إيقاف">
            <svg viewBox="0 0 24 24" class="i-play"><path class="fill" d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
            <svg viewBox="0 0 24 24" class="i-pause"><rect class="fill" x="6" y="5" width="4.2" height="14" rx="1.2"/><rect class="fill" x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg>
          </button>
          <button class="icon-btn" id="pNext" aria-label="التالي"><svg viewBox="0 0 24 24"><path class="fill" d="M6 6.5v11a1 1 0 0 0 1.6.8l7.4-5.5a1 1 0 0 0 0-1.6L7.6 5.7A1 1 0 0 0 6 6.5z"/><path d="M18 6v12"/></svg></button>
          <button class="icon-btn sm" id="pClose" aria-label="إغلاق المشغّل"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
      </div>
    </section>

    <nav class="tabbar" aria-label="التنقل">
      <a href="#/" data-tab="home">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>الرئيسية</span>
      </a>
      <a href="#/mushaf" data-tab="quran">
        <svg viewBox="0 0 24 24"><path d="M12 6c-2-1.5-5-2-8-2v14c3 0 6 .5 8 2 2-1.5 5-2 8-2V4c-3 0-6 .5-8 2zM12 6v14"/></svg>
        <span>القرآن</span>
      </a>
      <a href="#/mawaiz" data-tab="mawaiz">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <span>المواعظ</span>
      </a>
      <a href="#/adhkar" data-tab="adhkar">
        <svg viewBox="0 0 24 24"><path d="M8 21v-5.5L5.5 12a2 2 0 0 1 .3-2.6L9 6.5V3.5a1.5 1.5 0 0 1 3 0V12M16 21v-5.5l2.5-3.5a2 2 0 0 0-.3-2.6L15 6.5V3.5a1.5 1.5 0 0 0-3 0"/></svg>
        <span>الأذكار</span>
      </a>
      <a href="#/adhan" data-tab="adhan">
        <svg viewBox="0 0 24 24"><path d="M12 2.5c0 2.6-4 3.6-4 7.5v1h8v-1c0-3.9-4-4.9-4-7.5zM5 11h14M6 11v10h12V11M10 21v-4a2 2 0 0 1 4 0v4"/></svg>
        <span>الأذان</span>
      </a>
    </nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <audio id="audio" preload="none"></audio>
  <audio id="adhanAudio" preload="none"></audio>

  <script type="module" src="js/app.js"></script>
</body>
</html>
