name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The browser suites drive a real Chromium; the others do not need it.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # These two run without a server.
      - run: npm run test:physics
      - run: npm run test:weekly

      - name: Start the server
        run: |
          node server/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/cues > /dev/null && exit 0
            sleep 1
          done
          echo "server did not come up"; cat server.log; exit 1

      # The rest talk to it over HTTP, sockets and a browser.
      - run: npm run test:auth
      - run: npm run test:signin
      - run: npm run test:pvp
      - run: npm run test:ui

      - name: Server log
        if: failure()
        run: cat server.log || true
