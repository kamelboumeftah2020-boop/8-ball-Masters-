name: Build APK

on:
  push:
    branches: [main, master]
    paths: ['hifz-app/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hifz-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hifz-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Generate native Android project
        run: npx expo prebuild -p android --clean --no-install
      - name: Build release APK
        working-directory: hifz-app/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: hifz-apk
          path: hifz-app/android/app/build/outputs/apk/release/app-release.apk
